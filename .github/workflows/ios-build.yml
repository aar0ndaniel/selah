name: iOS build

on:
  push:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted([k for k in data if "iOS-26" in k], reverse=True)
          for runtime in ios:
              for d in data[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test (simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Selah.xcodeproj \
            -scheme Selah \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/test \
            CODE_SIGNING_ALLOWED=NO \
            | tee build-test.log | grep -E "error:|warning: |Test .*(passed|failed)|\*\* (TEST|BUILD)" || true
          exit ${PIPESTATUS[0]}

      - name: Build unsigned Release IPA
        run: |
          set -o pipefail
          xcodebuild build \
            -project Selah.xcodeproj \
            -scheme Selah \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build-release.log | grep -E "error:|\*\* BUILD" || true
          exit ${PIPESTATUS[0]}

      - name: Package Selah.ipa
        run: |
          rm -rf Payload Selah.ipa
          mkdir Payload
          cp -R build/release/Build/Products/Release-iphoneos/Selah.app Payload/
          zip -qry Selah.ipa Payload
          ls -lh Selah.ipa

      - name: Upload Selah.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Selah-ipa
          path: Selah.ipa
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log
          if-no-files-found: ignore
          retention-days: 7
