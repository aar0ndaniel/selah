# Modelled on the Kasemo (Mural) native.yml, whose unsigned IPA sideloads fine.
name: iOS build
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Device arm64 build
        run: xcodebuild -quiet -project Selah.xcodeproj -scheme Selah -configuration Release -destination 'generic/platform=iOS' -derivedDataPath .build/DeviceData CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build
      - name: Package IPA
        run: |
          mkdir -p .build/Payload
          cp -r .build/DeviceData/Build/Products/Release-iphoneos/Selah.app .build/Payload/
          cd .build
          zip -qr Selah.ipa Payload
          ls -lh Selah.ipa
      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Selah-iOS-IPA
          path: .build/Selah.ipa
          if-no-files-found: error
      # Cheap check on every push (~1 min): compile app + tests for the simulator, no boot.
      - name: Compile tests (no simulator)
        if: ${{ !(contains(github.event.head_commit.message, '[test]') || github.event_name == 'workflow_dispatch') }}
        run: xcodebuild -quiet -project Selah.xcodeproj -scheme Selah -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build-for-testing
      # Full run (~6 min, boots a simulator): only when the commit message has [test] or on manual runs.
      - name: Simulator unit tests
        if: ${{ contains(github.event.head_commit.message, '[test]') || github.event_name == 'workflow_dispatch' }}
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime in sorted([k for k in data if "iOS-26" in k], reverse=True):
              for d in data[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("no iOS 26 iPhone simulator found")
          ')
          echo "Using simulator $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -quiet -project Selah.xcodeproj -scheme Selah -destination "platform=iOS Simulator,id=$DEVICE,arch=arm64" -derivedDataPath .build/DerivedData -resultBundlePath .build/SelahTests.xcresult CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO test
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results
          path: .build/SelahTests.xcresult
          if-no-files-found: ignore
