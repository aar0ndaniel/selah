# Modelled on the Kasemo (Mural) native.yml, whose unsigned IPA sideloads fine.
name: iOS build
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Device arm64 build
        run: xcodebuild -quiet -project Selah.xcodeproj -scheme Selah -configuration Release -destination 'generic/platform=iOS' -derivedDataPath .build/DeviceData CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build
      - name: Package IPA
        run: |
          mkdir -p .build/Payload
          cp -r .build/DeviceData/Build/Products/Release-iphoneos/Selah.app .build/Payload/
          test -f .build/Payload/Selah.app/bible.sqlite || { echo "::error::bible.sqlite missing from Selah.app"; exit 1; }
          APPEX=.build/Payload/Selah.app/PlugIns/SelahWidgets.appex
          test -d "$APPEX" || { echo "::error::SelahWidgets.appex missing from Selah.app"; exit 1; }
          # Tehila.ipa: ad-hoc signed with the app group entitlements, so Sideloadly keeps the shared container the
          # widgets read (the extension first, then the app around it). Installs fine; an earlier 0xe8008014 error was
          # a blocked Apple ID, not the IPA.
          # Tehila-unsigned.ipa: spare copy without signatures, like the IPAs before the widgets.
          mkdir -p .build/unsigned && cp -r .build/Payload .build/unsigned/
          (cd .build/unsigned && zip -qr ../Tehila-unsigned.ipa Payload)
          codesign --force --sign - --entitlements Config/SelahWidgets.entitlements "$APPEX"
          codesign --force --sign - --entitlements Config/Selah.entitlements .build/Payload/Selah.app
          codesign -d --entitlements - .build/Payload/Selah.app 2>/dev/null | grep -q "group.com.aarondaniel.selah" || { echo "::error::app group entitlement missing"; exit 1; }
          (cd .build && zip -qr Tehila.ipa Payload)
          ls -lh .build/Tehila.ipa .build/Tehila-unsigned.ipa
      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        continue-on-error: true
        with:
          name: Tehila-iOS-IPA
          retention-days: 3
          path: |
            .build/Tehila.ipa
            .build/Tehila-unsigned.ipa
          if-no-files-found: error
      # Cheap check on every push (~1 min): compile app + tests for the simulator, no boot.
      - name: Compile tests (no simulator)
        if: ${{ !(contains(github.event.head_commit.message, '[test]') || contains(github.event.head_commit.message, '[shots]') || github.event_name == 'workflow_dispatch') }}
        run: xcodebuild -quiet -project Selah.xcodeproj -scheme Selah -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build-for-testing
      # Picks and boots an iOS 26 iPhone simulator for the unit tests and/or the screenshot run.
      - name: Boot simulator
        if: ${{ contains(github.event.head_commit.message, '[test]') || contains(github.event.head_commit.message, '[shots]') || github.event_name == 'workflow_dispatch' }}
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime in sorted([k for k in data if "iOS-26" in k], reverse=True):
              for d in data[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("no iOS 26 iPhone simulator found")
          ')
          echo "Using simulator $DEVICE"
          echo "SIM_UDID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
      # Full unit-test run (~6 min): only when the commit message has [test] or on manual runs.
      # The screenshot UI tests are skipped here; they have their own [shots] step below.
      - name: Simulator unit tests
        if: ${{ contains(github.event.head_commit.message, '[test]') || github.event_name == 'workflow_dispatch' }}
        run: |
          xcodebuild -quiet -project Selah.xcodeproj -scheme Selah -destination "platform=iOS Simulator,id=$SIM_UDID,arch=arm64" -derivedDataPath .build/DerivedData -resultBundlePath .build/SelahTests.xcresult CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO -skip-testing:SelahUITests test
      - name: Test summary
        if: ${{ always() && (contains(github.event.head_commit.message, '[test]') || github.event_name == 'workflow_dispatch') }}
        run: |
          if [ -d .build/SelahTests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path .build/SelahTests.xcresult --compact | python3 -c '
          import json, sys
          s = json.load(sys.stdin)
          print("SUMMARY result=%s total=%s passed=%s failed=%s skipped=%s" % (s.get("result"), s.get("totalTestCount"), s.get("passedTests"), s.get("failedTests"), s.get("skippedTests")))
          for f in s.get("testFailures", []):
              print("FAILED:", f.get("testName"), "-", f.get("failureText"))
          '
          fi
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        continue-on-error: true
        with:
          name: test-results
          retention-days: 2
          path: .build/SelahTests.xcresult
          if-no-files-found: ignore
      # Screenshots (~4 min): only when the commit message has [shots] or on manual runs.
      # Runs SelahUITests/ScreenshotTests against sample data and exports every attachment as a PNG.
      - name: Screenshot UI tests
        if: ${{ contains(github.event.head_commit.message, '[shots]') || github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 20
        run: |
          xcodebuild -quiet -project Selah.xcodeproj -scheme Selah -destination "platform=iOS Simulator,id=$SIM_UDID,arch=arm64" -derivedDataPath .build/DerivedData -resultBundlePath .build/Shots.xcresult CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO -only-testing:SelahUITests test
      - name: Export screenshots
        if: ${{ always() && (contains(github.event.head_commit.message, '[shots]') || github.event_name == 'workflow_dispatch') }}
        run: |
          if [ -d .build/Shots.xcresult ]; then
            xcrun xcresulttool export attachments --path .build/Shots.xcresult --output-path .build/Screenshots
            # Copy each exported file to a readable name (for example 01-today-light.png) using manifest.json.
            python3 - <<'PY' || true
          import json, os, shutil
          root = ".build/Screenshots"
          manifest = os.path.join(root, "manifest.json")
          if os.path.exists(manifest):
              for test in json.load(open(manifest)):
                  for att in test.get("attachments", []):
                      src = os.path.join(root, att.get("exportedFileName", ""))
                      name = att.get("suggestedHumanReadableName", "")
                      if os.path.isfile(src) and name:
                          base, ext = os.path.splitext(name)
                          # Drop the "_0_<UUID>" suffix Xcode adds.
                          base = base.split("_0_")[0]
                          shutil.copyfile(src, os.path.join(root, base + (ext or os.path.splitext(src)[1])))
          PY
            ls -l .build/Screenshots
            xcrun xcresulttool get test-results summary --path .build/Shots.xcresult --compact | python3 -c '
          import json, sys
          s = json.load(sys.stdin)
          print("SHOTS result=%s total=%s passed=%s failed=%s" % (s.get("result"), s.get("totalTestCount"), s.get("passedTests"), s.get("failedTests")))
          for f in s.get("testFailures", []):
              print("FAILED:", f.get("testName"), "-", f.get("failureText"))
          '
          fi
      - name: Upload screenshots
        if: ${{ always() && (contains(github.event.head_commit.message, '[shots]') || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        continue-on-error: true
        with:
          name: screenshots
          retention-days: 3
          path: .build/Screenshots
          if-no-files-found: ignore
      - name: Save screenshot results
        if: ${{ always() && (contains(github.event.head_commit.message, '[shots]') || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        continue-on-error: true
        with:
          name: shots-results
          retention-days: 2
          path: .build/Shots.xcresult
          if-no-files-found: ignore
