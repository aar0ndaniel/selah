name: Selah

options:
  bundleIdPrefix: com.aarondaniel
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Selah:
    type: application
    platform: iOS
    sources:
      - path: Selah
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarondaniel.selah
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Selah
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Sky AppIcon-Sunshine AppIcon-Leaf AppIcon-Peach AppIcon-Sand"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # Adds the selah:// URL scheme (widget taps) to the generated Info.plist.
        INFOPLIST_FILE: Config/Selah-Info.plist
        # App group shared with the widgets. Applied by the ad-hoc signing step in CI (signing is off in xcodebuild).
        CODE_SIGN_ENTITLEMENTS: Config/Selah.entitlements
    dependencies:
      - target: SelahWidgets

  # Home screen and lock screen widgets: verse of the day, streak with the mascot, mood.
  SelahWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SelahWidgets
      - path: Selah/Widgets
      - path: Selah/Resources/Mascot.xcassets
      - path: Selah/Resources/Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarondaniel.selah.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/SelahWidgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Selah
        CODE_SIGN_ENTITLEMENTS: Config/SelahWidgets.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  SelahTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SelahTests
    dependencies:
      - target: Selah
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aarondaniel.selah.tests

  SelahUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SelahUITests
    dependencies:
      - target: Selah
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aarondaniel.selah.uitests
        TEST_TARGET_NAME: Selah

schemes:
  Selah:
    build:
      targets:
        Selah: all
        SelahTests: [test]
        SelahUITests: [test]
    test:
      targets:
        - SelahTests
        - SelahUITests
